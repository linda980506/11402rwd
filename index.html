<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7ead4" />
    <meta name="description" content="經營狗狗最愛的餐車，接單、料理、送餐，打造汪界王牌餐車！" />
    <title>汪界王牌餐車日記</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #493424;
        --muted: #80684f;
        --orange: #d96e32;
        --orange-dark: #a95025;
        --green: #528447;
        --green-dark: #386337;
        --cream: #fffaf0;
        --line: #d7a368;
        --sand: #f2dfc3;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; }
      body { font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif; color: var(--ink); background: #f6ead6; }
      #game-container {
        position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden;
        display: flex; flex-direction: column; align-items: center;
        padding: 12px 18px 32px;
        background: #f6ead6 none center / cover fixed;
        isolation: isolate;
      }
      #game-container::before { content: ""; position: fixed; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(255,248,231,.24), rgba(92,58,28,.22)); pointer-events: none; }
      .panel {
        width: min(100%, 1020px); margin: 10px auto 0; padding: clamp(18px, 3vw, 32px);
        border: 3px solid var(--line); border-radius: 26px;
        background: rgba(255, 250, 240, .97); box-shadow: 0 16px 42px rgba(69, 44, 22, .28);
        max-height: calc(100vh - 35px); overflow-y: auto;
      }
      .panel::before { content: "✿ 今日餐車營業中 ✿"; display: block; width: fit-content; margin: -19px auto 14px; padding: 5px 14px; border-radius: 0 0 12px 12px; background: #5d8a50; color: #fff9e9; font-size: 13px; font-weight: 800; letter-spacing: .08em; }
      h1 { margin: 4px 0 10px; color: var(--orange); text-align: center; font-size: clamp(30px, 5vw, 48px); line-height: 1.15; text-shadow: 0 2px #ffe6bf; }
      h2 { margin: 4px 0 14px; color: var(--orange-dark); font-size: clamp(22px, 3vw, 30px); }
      h3 { margin: 18px 0 8px; color: #75502f; }
      p { line-height: 1.65; }
      button {
        min-height: 44px; margin: 5px; padding: 10px 17px; border: 0; border-radius: 13px;
        background: var(--orange); box-shadow: 0 4px 0 var(--orange-dark); color: white;
        font: inherit; font-weight: 800; cursor: pointer; transition: transform .12s ease, filter .12s ease, box-shadow .12s ease;
      }
      button:hover:not(:disabled) { filter: brightness(1.07); transform: translateY(-2px); }
      button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--orange-dark); }
      button:focus-visible { outline: 3px solid #315e37; outline-offset: 3px; }
      button:disabled { cursor: not-allowed; background: #b9ad9e; box-shadow: 0 3px 0 #8c8174; }
      button.green { background: var(--green); box-shadow: 0 4px 0 var(--green-dark); }
      button.sel { background: var(--green); box-shadow: 0 4px 0 var(--green-dark); outline: 3px solid #98bd79; }
      #mute { position: fixed; top: 12px; right: 14px; z-index: 10; width: 50px; padding: 8px; font-size: 21px; background: #fffaf0; color: var(--ink); border: 2px solid var(--line); box-shadow: 0 3px 0 #ad7642; }
      .hud { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 20px; width: fit-content; max-width: calc(100% - 70px); margin: 0 auto 2px; padding: 9px 18px; border: 2px solid var(--line); border-radius: 18px; background: rgba(255,250,240,.97); box-shadow: 0 4px 14px #452c1630; font-weight: 800; }
      button.home-button { min-height: 36px; margin: 0; padding: 6px 11px; border: 1px solid #d5bd9b; background: #fffaf0; color: #745d43; box-shadow: 0 2px 0 #ad7642; font-size: 13px; white-space: nowrap; }
      .row { display: flex; gap: clamp(14px, 3vw, 28px); align-items: flex-start; }
      .portrait { display: block; flex: 0 0 200px; width: 200px; max-width: 34%; aspect-ratio: 4 / 5; object-fit: contain; border: 3px solid var(--line); border-radius: 22px; background: linear-gradient(#fff9e9, #f5dfbd); }
      .bubble { margin: 10px 0; padding: 13px 17px; border: 2px solid #e4c18f; border-radius: 18px 18px 18px 5px; background: white; font-size: 18px; line-height: 1.55; }
      .bar { height: 17px; margin: 7px 0 12px; overflow: hidden; border: 2px solid #dbc7a9; border-radius: 99px; background: #eddfca; }
      .bar > div { width: 100%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #72ac62, #a5cb72); transition: width .12s linear; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(142px, 1fr)); gap: 8px; }
      .grid button { margin: 2px; min-height: 62px; }
      .ingredient-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 5px; }
      .ingredient-grid button { margin: 2px; padding: 8px; min-height: 42px; background: #b77946; box-shadow: 0 3px 0 #88542f; font-size: 15px; }
      .ingredient-grid button.sel { background: var(--green); box-shadow: 0 3px 0 var(--green-dark); }
      .tag { display: inline-block; margin: 2px 4px 2px 0; padding: 4px 9px; border-radius: 9px; background: #f2e1c7; color: #67472a; font-size: 14px; font-weight: 700; }
      .big { color: var(--orange); text-align: center; font-size: clamp(48px, 9vw, 72px); font-weight: 900; line-height: 1.1; }
      .zone { position: relative; height: 38px; margin: 14px 0; overflow: hidden; border: 2px solid #c5b49a; border-radius: 12px; background: repeating-linear-gradient(90deg, #eadcc6 0 9%, #e4d2b7 9% 10%); }
      .zone .ok { position: absolute; top: 0; bottom: 0; background: #91c97c; box-shadow: inset 0 0 0 2px #5e9c4d; }
      .zone .cur { position: absolute; top: 0; bottom: 0; width: 7px; border-radius: 4px; background: #dc512b; box-shadow: 0 0 7px #70210e; }
      .goal { padding: 10px 14px; margin: 7px 0; border: 2px solid #ead2ae; border-radius: 14px; background: #fffdf8; font-weight: 700; }
      .career { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 14px 0; padding: 12px; border: 1px solid #ead2ae; border-radius: 16px; background: #f8edda; text-align: center; font-weight: 700; }
      .career > div { display: grid; gap: 3px; padding: 5px; }
      .career strong { color: var(--orange-dark); font-size: 18px; }
      .strategy-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 10px 0 16px; }
      button.strategy-card { display: grid; align-content: start; justify-items: start; gap: 7px; min-height: 146px; margin: 0; padding: 14px; border: 2px solid #ead2ae; background: #fffdf8; box-shadow: 0 3px 0 #d7c3a5; color: var(--ink); text-align: left; white-space: normal; }
      button.strategy-card strong { color: #76502f; font-size: 17px; }
      button.strategy-card small { color: var(--muted); font-size: 13px; line-height: 1.5; }
      button.strategy-card .strategy-icon { font-size: 24px; }
      button.strategy-card.selected { border-color: #528447; background: #f1f7e9; box-shadow: 0 3px 0 #386337; outline: 3px solid #b4d09a; }
      .planning-heading { text-align: center; }
      .planning-heading h2 { margin: 8px 0 4px; }
      .reputation-card { margin: 12px 0; padding: 13px 16px; border: 2px solid #e8ca7b; border-radius: 16px; background: linear-gradient(100deg, #fff5d9, #fffdf8); }
      .rep-heading { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 8px; }
      .rep-heading strong { flex: 1; color: #765029; }
      .rep-heading b { color: #a95025; }
      .rep-track { height: 11px; margin-bottom: 6px; overflow: hidden; border-radius: 99px; background: #eadcc5; }
      .rep-track span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #f3ad4d, #79ad62); }
      .promotion-note { margin: 8px 0; padding: 11px 14px; border: 1px solid #e8ca7b; border-radius: 12px; background: #fff5d9; color: #765029; font-weight: 900; text-align: center; }
      .journal-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 8px; margin-bottom: 14px; }
      .journal-card { display: flex; align-items: center; gap: 9px; min-width: 0; padding: 8px; border: 1px solid #ead2ae; border-radius: 13px; background: #fffdf8; }
      .journal-card img { flex: 0 0 52px; width: 52px; height: 52px; object-fit: contain; border-radius: 50%; background: #f8edda; }
      .journal-card strong { font-size: 14px; }
      .journal-card small { font-size: 12px; }
      .center { text-align: center; }
      .muted { color: var(--muted); }
      .rule { padding: 12px 15px; border-radius: 14px; background: #f8edda; line-height: 1.65; }
      .upgrade { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
      .upgrade button { white-space: nowrap; }
      .receipt { padding: 12px 15px; border-radius: 16px; background: #fffdf8; line-height: 1.8; }
      .result-card { display: flex; align-items: center; justify-content: center; gap: 18px; }
      .title-hero { display: grid; grid-template-columns: 1.05fr .95fr; align-items: center; gap: 16px; overflow: hidden; position: relative; min-height: 278px; margin: -4px -6px 14px; padding: clamp(20px, 4vw, 36px); border: 1px solid #eed0a4; border-radius: 22px; background: linear-gradient(115deg, #fff4df 0%, #ffe6bf 60%, #f8d9a6 100%); }
      .title-copy { position: relative; z-index: 1; }
      .eyebrow { display: inline-block; padding: 5px 10px; border: 1px solid #d9b580; border-radius: 999px; background: #fffaf0; color: #6d7e49; font-size: 12px; font-weight: 900; letter-spacing: .08em; }
      .title-copy h1 { margin: 12px 0 8px; text-align: left; color: #ba572c; font-size: clamp(34px, 5vw, 54px); text-shadow: 0 2px #ffe7bf; }
      .title-lead { max-width: 410px; margin: 0; color: #654a34; font-size: 17px; font-weight: 700; }
      .title-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin: 16px 0 0; }
      .title-actions button { margin: 3px; }
      .hero-button { min-height: 52px; padding: 12px 20px; font-size: 17px; }
      button.quick-button { background: #fffaf0; color: #64462e; border: 2px solid #d7a368; box-shadow: 0 4px 0 #ad7642; }
      .tiny-note { margin: 9px 0 0; color: #796044; font-size: 12px; }
      .hero-dogs { position: relative; align-self: stretch; min-height: 220px; }
      .hero-dogs::before { content: ""; position: absolute; inset: 10% 2% 0; border-radius: 48% 52% 20px 20px; background: radial-gradient(ellipse at 50% 65%, #fff7e7 0%, #f3cf91 74%, transparent 75%); }
      .hero-dog { position: absolute; bottom: -6px; width: 48%; height: 90%; object-fit: contain; filter: drop-shadow(0 6px 3px rgba(104, 67, 34, .18)); }
      .hero-dog-1 { left: 0; z-index: 1; transform: rotate(-7deg) scale(.82); }
      .hero-dog-2 { left: 26%; z-index: 2; height: 100%; }
      .hero-dog-3 { right: -2%; z-index: 1; transform: rotate(7deg) scale(.82); }
      .hero-sticker { position: absolute; z-index: 3; right: 0; top: 9%; display: grid; place-content: center; width: 66px; height: 66px; border: 2px dashed #fff4dd; border-radius: 50%; background: #d96e32; color: white; text-align: center; font-size: 12px; font-weight: 900; line-height: 1.15; transform: rotate(9deg); box-shadow: 0 3px 8px #70452233; }
      .feature-strip { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; margin: 12px 0; }
      .feature-strip span { padding: 7px 11px; border: 1px solid #ead2ae; border-radius: 999px; background: #fffdf8; color: #684d34; font-size: 13px; font-weight: 800; }
      .how-to-play, .guestbook { margin: 10px 0; border: 1px solid #ead2ae; border-radius: 14px; background: #fffdf8; }
      .how-to-play summary, .guestbook summary { padding: 12px 15px; color: #75502f; font-weight: 900; cursor: pointer; }
      .how-to-play .rule { margin: 0 10px 10px; }
      .guestbook .journal-grid { padding: 0 10px 10px; }
      .title-footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px; color: var(--muted); font-size: 12px; }
      button.quiet-button { min-height: 36px; margin: 0; padding: 6px 12px; border: 1px solid #d5bd9b; background: #fffaf0; color: #745d43; box-shadow: none; font-size: 13px; }
      .day-header { width: min(100%, 1020px); margin: 0 auto 2px; }
      .day-progress { height: 8px; max-width: min(640px, 85%); margin: 7px auto 0; overflow: hidden; border: 1px solid #fffaf0; border-radius: 99px; background: #735d463b; box-shadow: 0 2px 7px #452c1622; }
      .day-progress span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #f3ad4d, #79ad62); transition: width .3s ease; }
      .dish-button { display: grid; justify-items: center; align-content: center; gap: 3px; }
      .dish-button .dish-emoji { font-size: 24px; line-height: 1; }
      .dish-button small { color: #fff6e7; }
      .dish-button.sel small { color: #f1ffe8; }
      .recipe-card { display: flex; align-items: center; gap: 12px; margin: 7px 0 10px; padding: 11px 14px; border: 2px dashed #d8b888; border-radius: 15px; background: #fff9ec; }
      .recipe-card.recipe-ready { border-style: solid; background: #f3f8e9; }
      .recipe-icon { display: grid; flex: 0 0 42px; place-items: center; width: 42px; height: 42px; border-radius: 13px; background: #f2e1c7; font-size: 23px; }
      .recipe-card > div { display: grid; gap: 3px; }
      .recipe-card small { font-weight: 500; }
      .summary-heading { margin-bottom: 14px; text-align: center; }
      .summary-heading h2 { margin: 8px 0 2px; }
      .summary-heading p { margin: 4px 0; color: var(--muted); }
      .summary-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin: 12px 0; }
      .summary-stats > div { display: grid; gap: 4px; place-content: center; min-height: 84px; padding: 8px; border: 1px solid #ead2ae; border-radius: 14px; background: #fffdf8; text-align: center; }
      .summary-stats strong { color: #b85d30; font-size: 24px; }
      .summary-stats strong span { color: #7a674f; font-size: 14px; }
      .mvp-card { display: flex; align-items: center; gap: 12px; margin: 12px 0; padding: 9px 14px; border: 2px solid #e8ca7b; border-radius: 16px; background: linear-gradient(100deg, #fff5d9, #fffdf8); font-size: 23px; }
      .mvp-card img { width: 60px; height: 60px; object-fit: contain; border-radius: 50%; background: #fff; }
      .mvp-card div { display: grid; flex: 1; gap: 2px; }
      .mvp-card strong { color: #765029; font-size: 16px; }
      .mvp-card span { color: #75624b; font-size: 13px; }
      .summary-receipt { margin: 10px 0; }
      .summary-receipt > div { display: flex; justify-content: space-between; gap: 10px; }
      .summary-receipt strong { color: #a95025; }
      .dialog-overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 18px; background: rgba(47, 33, 20, .58); }
      .confirm-dialog { width: min(100%, 460px); padding: 24px; border: 3px solid var(--line); border-radius: 22px; background: var(--cream); box-shadow: 0 18px 50px rgba(35, 24, 13, .35); }
      .confirm-dialog h2 { margin-top: 0; }
      .confirm-dialog p { line-height: 1.6; }
      button.danger { background: #a94331; box-shadow: 0 4px 0 #752d22; }
      small { color: #6f5b45; }
      @media (max-width: 650px) {
        #game-container { padding: 10px 10px 22px; }
        .panel { max-height: calc(100vh - 74px); padding: 18px 15px; margin-top: 8px; border-radius: 20px; }
        .panel::before { margin-top: -12px; }
        .row { align-items: center; flex-direction: column; }
        .portrait { flex-basis: auto; width: 150px; max-width: 55%; aspect-ratio: 1; }
        .hud { gap: 4px 10px; padding: 7px 11px; font-size: 13px; }
        #mute { top: 10px; right: 9px; width: 43px; min-height: 42px; }
        .result-card { flex-direction: column; gap: 5px; }
        .title-hero { grid-template-columns: 1fr; gap: 2px; min-height: 0; padding: 20px; }
        .title-copy h1 { font-size: clamp(35px, 10vw, 48px); }
        .hero-dogs { min-height: 190px; margin-top: -6px; }
        .hero-dog { width: 44%; }
        .hero-dog-2 { left: 28%; }
        .hero-sticker { right: 4%; top: 2%; width: 58px; height: 58px; }
        .career { grid-template-columns: repeat(2, 1fr); }
        .strategy-grid { grid-template-columns: 1fr; }
        button.strategy-card { min-height: 0; grid-template-columns: 34px 1fr; align-items: center; column-gap: 8px; }
        button.strategy-card .strategy-icon { grid-row: span 2; }
        button.strategy-card small { grid-column: 2; }
        .summary-stats { grid-template-columns: repeat(2, 1fr); }
        .title-footer { align-items: flex-start; }
        .title-footer span { max-width: 60%; }
        .day-header .hud { max-width: calc(100% - 54px); }
        button { font-size: 16px; }
      }
      @media (max-width: 390px) {
        .feature-strip { gap: 5px; }
        .feature-strip span { padding: 6px 8px; font-size: 11px; }
        .title-actions { display: grid; }
        .title-actions button { width: 100%; }
        .title-footer { font-size: 11px; }
      }
      /* Warm picture-book game presentation */
      #game-container { background-image: none; background-position: center; }
      #game-container::before { background: linear-gradient(180deg, rgba(255,248,231,.12), rgba(74,48,27,.13)); }
      .panel { width: min(100%, 1100px); border: 3px solid #c88b50; background: rgba(255,250,239,.975); box-shadow: 0 18px 50px rgba(68,43,21,.32), inset 0 0 0 5px rgba(255,255,255,.56); }
      .panel::before { background: #587a47; box-shadow: 0 2px 5px #53371e26; }
      .panel:has(.title-hero) { width: min(100%, 1220px); padding: clamp(15px, 2.5vw, 28px); }
      .panel h2 { letter-spacing: .015em; }
      .panel h3 { color: #6f4b2e; }
      .title-hero { min-height: 360px; grid-template-columns: 1.04fr .96fr; margin: -7px -8px 14px; padding: clamp(16px, 2.4vw, 28px); border: 2px solid rgba(255,250,235,.86); background: linear-gradient(90deg, rgba(78,49,27,.07), rgba(255,245,221,.04)), none center / cover; box-shadow: inset 0 0 0 1px rgba(128,83,42,.16), 0 6px 18px rgba(76,51,29,.14); }
      .title-copy { grid-column: 2; grid-row: 1; justify-self: stretch; align-self: center; padding: clamp(17px, 2.4vw, 28px); border: 2px solid rgba(206,155,95,.78); border-radius: 24px; background: rgba(255,250,237,.9); box-shadow: 0 8px 24px rgba(76,51,29,.16), inset 0 0 0 3px rgba(255,255,255,.66); backdrop-filter: blur(3px); }
      .title-copy h1 { color: #9c4828; font-size: clamp(38px, 4.8vw, 58px); line-height: 1.04; text-shadow: 0 2px #ffe7bf, 1px 3px #fff8e8; }
      .title-lead { font-size: clamp(16px, 1.8vw, 20px); color: #62442e; }
      .eyebrow { color: #587447; background: #fffdf3; }
      .hero-dogs { grid-column: 1; grid-row: 1; min-height: 288px; align-self: end; }
      .hero-dogs::before { inset: 24% 1% 0; background: radial-gradient(ellipse at 50% 72%, rgba(255,247,226,.91), rgba(245,215,166,.36) 68%, transparent 70%); }
      .hero-dog { bottom: -3px; height: 87%; object-fit: contain; filter: drop-shadow(0 7px 3px rgba(73,48,28,.23)); }
      .hero-dog-1 { left: -5%; width: 31%; transform: rotate(-4deg); }
      .hero-dog-2 { left: 15%; width: 30%; height: 92%; transform: rotate(-2deg); }
      .hero-dog-3 { left: 34%; width: 31%; z-index: 3; height: 96%; }
      .hero-dog-4 { left: 54%; width: 30%; z-index: 2; transform: rotate(2deg); }
      .hero-dog-5 { right: -5%; width: 31%; z-index: 1; transform: rotate(4deg); }
      .hero-sticker { right: 2%; top: 6%; background: #d36e36; border-color: #fff4dd; }
      .title-actions { align-items: stretch; }
      .hero-button { min-height: 54px; border-radius: 16px; padding: 12px 20px; background: linear-gradient(180deg,#e98243,#cf602e); box-shadow: 0 5px 0 #a44a25, 0 8px 14px rgba(117,63,30,.15); }
      button.green { background: linear-gradient(180deg,#74a45b,#528447); box-shadow: 0 4px 0 #386337, 0 6px 12px rgba(47,90,47,.13); }
      button.quick-button, button.quiet-button { color: #62462f; background: #fff9ed; border-color: #d5b285; box-shadow: 0 3px 0 #ad7642; }
      button:disabled { opacity: .66; filter: saturate(.65); }
      .feature-strip { margin: 15px auto; max-width: 940px; }
      .feature-strip span { border-color: #e6cfad; background: #fffdf8; box-shadow: 0 2px 5px rgba(95,64,36,.06); }
      .career { border-color: #ead3ae; background: linear-gradient(135deg,#fff9eb,#f5e4ca); }
      .how-to-play, .guestbook { border-color: #e6cfad; }
      .title-footer { padding-top: 8px; border-top: 1px dashed #d7bc94; }
      .hud { width: 100%; max-width: 1100px; justify-content: center; gap: 7px 12px; border-color: rgba(212,166,105,.95); background: rgba(255,249,235,.97); box-shadow: 0 5px 18px rgba(63,42,25,.2); }
      .day-header { width: min(100%, 1100px); }
      .day-progress { max-width: 720px; height: 10px; background: rgba(100,72,47,.58); }
      .day-progress span { background: linear-gradient(90deg,#f4bd55,#74aa61); }
      .customer-layout { display: grid; grid-template-columns: minmax(185px,.78fr) minmax(300px,1.45fr) minmax(205px,.92fr); gap: 16px; align-items: stretch; }

        button.dish-button { min-height: 142px; }
        .dish-art-frame { height: 87px; }
        .kitchen-action-row { align-items: stretch; }
        .kitchen-action-row > span { width: 100%; }
        .kitchen-action-row button { flex: 1 1 auto; }
        .selected-dish-banner { gap: 8px; padding: 8px; }
        .selected-dish-banner > img { width: 63px; height: 58px; }
        .selected-dish-banner strong { font-size: 17px; }
        .selected-dish-banner .helper-badge { display: none; }
        .ingredient-grid.illustrated-ingredients { grid-template-columns: repeat(3,minmax(0,1fr)); gap: 7px; }
        button.ingredient-card { min-height: 78px; font-size: 13px; }
        .game-step-head { align-items: flex-start; flex-direction: column; }
        .guest-order-pill { max-width: 100%; border-radius: 13px; }
        .cooking-stage { min-height: 165px; }
        .heat-legend { justify-content: center; gap: 5px 11px; font-size: 11px; }
        .zone.heat-zone { height: 33px; }
        .result-card { flex-direction: column; align-items: center; }
        .reaction-portrait-wrap { flex-basis: auto; width: min(100%,235px); min-height: 205px; }
        .result-portrait { max-height: 195px; }
        .result-details { width: 100%; }
        .result-heading h2 { margin-bottom: 6px; }
        .satisfaction-score { text-align: center; }
        .rating-label { text-align: center; }
        .summary-stats { grid-template-columns: repeat(2,minmax(0,1fr)); }
        .summary-stats > div:last-child { grid-column: 1 / -1; }
        .mvp-card { font-size: 17px; }
        .mvp-card img { flex: 0 0 54px; width: 54px; height: 54px; }
        .upgrade-card { flex-wrap: wrap; gap: 8px; }
        .upgrade-copy { flex-basis: calc(100% - 65px); }
        .upgrade-card > button { width: 100%; }
        .upgrade-sparkles { right: 20px; }
        .plated-dish-card { gap: 9px; padding: 9px; }
        .plated-dish-card img { flex-basis: 86px; width: 86px; height: 84px; }
        .plated-dish-card strong { font-size: 18px; }
        .walkout-card { align-items: flex-start; gap: 10px; padding: 10px; }
        .walkout-card img { flex: 0 0 90px; width: 90px; height: 115px; }
        .hud { max-width: calc(100% - 54px); gap: 4px 8px; padding: 7px 9px; font-size: 12px; }

        .title-footer { align-items: center; font-size: 11px; }

  { type: 'flawless', target: 3, text: '正確食材與完美火候完成 3 道', reward: 75 }
];
const REPUTATION_RANKS = [
  { name: '見習攤主', reputation: 0, reward: 0 },
  { name: '公園人氣王', reputation: 250, reward: 80 },
  { name: '明星主廚', reputation: 700, reward: 150 },
  { name: '汪界王牌', reputation: 1400, reward: 250 }
];
function rankForReputation(reputation) {
  let rank = 0;
  for (let i = 1; i < REPUTATION_RANKS.length; i++) {
    if (reputation >= REPUTATION_RANKS[i].reputation) rank = i;
  }
  return rank;
}

let state = loadGame();
let day = null;
let order = null;
let gameScreen = 'title';
let timers = [];
let patienceTimer = null;
let modalPausedAt = null;

function defaultState() {
  return { coins: 0, day: 1, upgrades: { cook: 0, seat: 0, sign: 0 }, npcLog: {}, served: 0, reputation: 0, rank: 0, session: null };
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return defaultState();
    const saved = JSON.parse(raw);
    const base = defaultState();
    const upgrades = {};
    for (const key of Object.keys(base.upgrades)) {
      const value = saved.upgrades?.[key];
      upgrades[key] = Number.isFinite(value) ? Math.max(0, Math.min(5, Math.floor(value))) : 0;
    }
    const reputation = Number.isFinite(saved.reputation) ? Math.max(0, Math.floor(saved.reputation)) : 0;
    const rank = Number.isFinite(saved.rank)
      ? Math.max(0, Math.min(REPUTATION_RANKS.length - 1, Math.floor(saved.rank)))
      : rankForReputation(reputation);
    return {
      ...base,
      ...saved,
      coins: Number.isFinite(saved.coins) ? Math.max(0, Math.floor(saved.coins)) : 0,
      day: Number.isFinite(saved.day) ? Math.max(1, Math.floor(saved.day)) : 1,
      served: Number.isFinite(saved.served) ? Math.max(0, Math.floor(saved.served)) : 0,
      reputation,
      rank,
      upgrades,
      npcLog: saved.npcLog && typeof saved.npcLog === 'object' ? saved.npcLog : {},
      session: saved.session && typeof saved.session === 'object' ? saved.session : null
    };
  } catch {
    return defaultState();
  }
}

function saveGame(pausedAt = null) {
  try {
    if (day && gameScreen !== 'title') {
      state.session = {
        screen: gameScreen,
        day: { ...day, goals: day.goals.map((goal) => ({ ...goal })) },
        order: order ? { ...order, items: [...(order.items || [])], result: order.result ? { ...order.result, reasons: [...order.result.reasons] } : null } : null
      };
      if (pausedAt !== null) state.session.pausedAt = pausedAt;
      if (pausedAt !== null && modalPausedAt !== null && state.session.order) {
        const duration = Math.max(0, pausedAt - modalPausedAt);
        if (Number.isFinite(state.session.order.start)) state.session.order.start += duration;
        if (state.session.order.cooking && Number.isFinite(state.session.order.cookingStartedAt)) state.session.order.cookingStartedAt += duration;
      }
    } else if (gameScreen === 'title') {
      state.session = null;
    }
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
  } catch (error) {
    console.warn('存檔失敗，遊戲仍可繼續。', error);
    if (!document.getElementById('save-warning')) {
      const notice = document.createElement('div');
      notice.id = 'save-warning'; notice.className = 'save-warning';
      notice.textContent = '瀏覽器無法保存進度；本次仍可遊玩，關閉後可能無法續玩。';
      document.body.appendChild(notice);
    }
  }
}

let muted = false;
let audioCtx = null;
function tone(freq = 660, duration = 0.09, gain = 0.045) {
  if (muted) return;
  try {
    audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const vol = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq; vol.gain.value = gain;
    osc.connect(vol); vol.connect(audioCtx.destination);
    osc.start(); vol.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration); osc.stop(audioCtx.currentTime + duration);
  } catch (_) {}
}
function play(name) { if (name === 'coin') { tone(880,.07,.04); setTimeout(()=>tone(1175,.09,.035),55); } else tone(700,.1,.04); }
const bgm = { paused:true, play(){ return Promise.resolve(); }, pause(){}, loop:true, volume:0 };
const muteBtn = document.createElement('button');
muteBtn.id = 'mute'; muteBtn.type = 'button'; muteBtn.setAttribute('aria-label', '切換音效'); muteBtn.textContent = '🔊';
muteBtn.onclick = () => { muted = !muted; muteBtn.textContent = muted ? '🔇' : '🔊'; muteBtn.setAttribute('aria-label', muted ? '開啟音效' : '關閉音效'); };
document.body.appendChild(muteBtn);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
function shuffled(values) {
  const items = [...values];
  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }
  return items;
}
function clearTimers() {
  timers.forEach(clearInterval);
  timers = [];
  if (patienceTimer !== null) {
    clearInterval(patienceTimer);
    patienceTimer = null;
  }
}
function render(html, nextScreen = gameScreen) {

// 每日目標採純資料格式，方便安全存檔及載入。
function goalMet(goal) {
  if (goal.type === 'served') return day.served >= goal.target;
  if (goal.type === 'earned') return day.earned >= goal.target;
  if (goal.type === 'great') return day.great >= goal.target;
  if (goal.type === 'combo') return day.bestCombo >= goal.target;
  if (goal.type === 'fast') return day.fastServed >= goal.target;
  if (goal.type === 'flawless') return day.flawless >= goal.target;
  return false;
}
function goalProgress(goal) {
  if (goal.type === 'served') return day.served;
  if (goal.type === 'earned') return day.earned;
  if (goal.type === 'great') return day.great;
  if (goal.type === 'combo') return day.bestCombo;
  if (goal.type === 'fast') return day.fastServed;
  if (goal.type === 'flawless') return day.flawless;
  return 0;
}
function dailyGoalsMarkup() {
  return `<section class="daily-goals-card"><h3>🎯 今日目標</h3>${day.goals.map((goal) => {
    const progress = Math.min(goal.target, goalProgress(goal));
    return `<div class="daily-goal-row ${goalMet(goal) ? 'complete' : ''}"><span>${goalMet(goal) ? '✓' : '🐾'}</span><span class="daily-goal-copy">${goal.text}<small>${goal.type === 'earned' ? `${progress}／${goal.target} 金` : `${progress}／${goal.target}`}</small></span></div>`;
  }).join('')}</section>`;
}
function dailyRevenueTarget(dayNumber = state.day) {
  return 220 + Math.min(6, Math.max(0, dayNumber - 1)) * 15;
}
function createDay() {
  const target = dailyRevenueTarget();
  const contract = pick(DAILY_CONTRACTS);
  return {
    queue: shuffled(Object.keys(NPCS)), index: 0, combo: 0, bestCombo: 0, earned: 0, great: 0, served: 0,
    fastServed: 0, flawless: 0, reputationEarned: 0,
    satisfactionTotal: 0, topSatisfaction: 0, topCustomer: null,
    lastGood: false, summaryPaid: false, summaryBonus: 0, promotions: [], strategy: null,
    goals: [
      { type: 'served', target: 4, text: '服務至少 4 位顧客', reward: 30 },
      { type: 'earned', target, text: `今日營收達到 ${target} 金幣`, reward: 40 },
      { type: 'great', target: 2, text: '獲得 2 次「非常滿意」', reward: 50 },
      { ...contract }
    ]
  };
}

function showHomeConfirmation() {
  if (!day || document.getElementById('home-confirmation')) return;
  const pausedAt = Date.now();
  modalPausedAt = pausedAt;
  clearTimers();
  const overlay = document.createElement('div');
  overlay.id = 'home-confirmation';
  overlay.className = 'dialog-overlay';
  overlay.innerHTML = `<section class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="home-title" aria-describedby="home-description">
    <h2 id="home-title">暫停營業，回到首頁？</h2>
    <p id="home-description">目前的營業進度會自動保存，之後可以從首頁繼續上次營業。</p>
    <div class="center"><button id="cancel-home" class="green" type="button">取消</button><button id="confirm-home" class="quiet-button" type="button">回到首頁</button></div>
  </section>`;
  document.body.appendChild(overlay);

  const dismiss = () => {
    modalPausedAt = null;
    document.removeEventListener('keydown', handleKeydown);
    overlay.remove();
  };
  const resume = () => {
    dismiss();
    const pauseDuration = Date.now() - pausedAt;
    if (order) {
      if (Number.isFinite(order.start)) order.start += pauseDuration;
      if (order.cooking && Number.isFinite(order.cookingStartedAt)) order.cookingStartedAt += pauseDuration;
    }
    if (gameScreen === 'customer' || gameScreen === 'kitchen' || gameScreen === 'ingredients') startPatience();
    if (gameScreen === 'cooking') {
      startCooking(true);
      return;
    }
    saveGame();
  };
  const handleKeydown = (event) => {
    if (event.key === 'Escape') resume();
  };
  document.addEventListener('keydown', handleKeydown);
  overlay.addEventListener('click', (event) => {
    if (event.target === overlay) resume();
  });
  document.getElementById('cancel-home').onclick = resume;
  document.getElementById('confirm-home').onclick = () => {
    if (order) {
      const duration = Date.now() - pausedAt;
      if (Number.isFinite(order.start)) order.start += duration;
      if (order.cooking && Number.isFinite(order.cookingStartedAt)) order.cookingStartedAt += duration;
    }
    modalPausedAt = null;
    saveGame(Date.now());
    dismiss();
    showTitle();
  };
  document.getElementById('cancel-home').focus();
}

function nextCustomer() {

function startPatience() {
  if (patienceTimer !== null) clearInterval(patienceTimer);

    const left = 1 - (Date.now() - order.start) / 1000 / order.patience;

    if (bar) {
      bar.style.width = `${Math.max(0, left * 100)}%`;
      bar.style.background = left < 0.3 ? '#d9533a' : '';

  }).join('');
  render(`<div class="game-step-head"><div><span class="eyebrow">PREP · 食材備料</span><h2>② 選擇食材</h2></div><span class="guest-order-pill">顧客訂單：${DISHES[order.dishKey].name}</span></div>
    <div class="selected-dish-banner"><img src="${dish.art}" alt="${dish.name}插畫" draggable="false"><div><small>目前料理</small><strong>${dish.name}</strong><span>${order.items.length} 項食材已選擇</span></div><span class="helper-badge">✨ 細心備料可提高完成評價</span></div>
    <div class="recipe-card"><span class="recipe-icon">📖</span><div><strong>食譜：${dish.name}</strong><small>${dish.items.join(' ＋ ')}</small></div></div><p class="ingredient-instruction">從食材架挑選要使用的材料。再次點選已選項目即可取消；正確搭配會在送餐後反映於評分。</p>
    <div class="ingredient-grid illustrated-ingredients">${ingredientButtons}</div>
    <div class="kitchen-action-row ingredient-actions"><button id="back-dishes" class="quick-button" type="button">← 回到料理選擇</button><button id="confirm-ingredients" class="green hero-button" type="button" ${order.items.length ? '' : 'disabled'}>確認食材，開始料理　→</button></div>
    <div class="food-disclaimer">食材與料理配方僅供虛構遊戲玩法，不代表真實犬隻的營養、食材安全或餵食建議。</div>`, 'ingredients');
  INGREDIENTS.forEach((ingredient, index) => bind(`i-${index}`, () => {
    order.items = order.items.includes(ingredient)
      ? order.items.filter((item) => item !== ingredient)
      : [...order.items, ingredient];
    showIngredients();
  }));
  bind('back-dishes', showKitchen);
  bind('confirm-ingredients', () => startCooking());
  startPatience();
  saveGame();
}

function startCooking(resume = false) {
  clearTimers();
  if (!order.chosen || !order.items.length) return showKitchen();
  order.cooking = true;
  order.cookDuration = order.cookDuration || cookTime(order.chosen);
  if (!resume || !order.cookingStartedAt) order.cookingStartedAt = Date.now();
  showCooking();
  saveGame();
  const { fireStart: okStart, fireEnd: okEnd } = currentStrategy();
  const tick = () => {
    const elapsed = (Date.now() - order.cookingStartedAt) / 1000;
    const progress = elapsed / order.cookDuration;
    const pointer = document.getElementById('cur');
    if (pointer) pointer.style.left = `${Math.min(100, progress * 100)}%`;
    const countdown = document.getElementById('cd');
    if (countdown) countdown.textContent = Math.max(0, order.cookDuration - elapsed).toFixed(1);
    if (progress >= 1) finishCooking('burnt');
  };
  tick();
  if (gameScreen === 'cooking') timers.push(setInterval(tick, 50));
  bind('done', () => {
    const progress = (Date.now() - order.cookingStartedAt) / 1000 / order.cookDuration;
    finishCooking(progress >= okStart && progress <= okEnd ? 'perfect' : progress < okStart ? 'raw' : 'burnt');
  });
}
function showCooking() {
  const { fireStart, fireEnd } = currentStrategy();
  const zoneStart = Math.round(fireStart * 100);
  const zoneWidth = Math.round((fireEnd - fireStart) * 100);
  const dish = DISHES[order.chosen];
  render(`<div class="cooking-heading"><span class="eyebrow">STOVE · 火候挑戰</span><h2>③ 料理製作</h2><p>留意指針，進入森林綠色的完美區間時按下完成！</p></div>
    <div class="cooking-stage"><div class="cooking-spark spark-one">✦</div><div class="cooking-spark spark-two">✧</div><div class="steam steam-one"></div><div class="steam steam-two"></div><div class="pan-illustration"><img src="${dish.art}" alt="正在製作的${dish.name}" draggable="false"><span class="pan-flame">♨</span></div><div class="cooking-dish-label">${dish.emoji} ${dish.name}</div></div>
    <div class="countdown-card"><span>⏱ 剩餘時間</span><strong><span id="cd">${order.cookDuration.toFixed(1)}</span><small> 秒</small></strong></div>
    <div class="heat-legend"><span><i class="heat-raw"></i>太早</span><span><i class="heat-warm"></i>接近完成</span><span><i class="heat-perfect"></i>完美火候</span><span><i class="heat-burnt"></i>過熟</span></div>
    <div class="zone heat-zone" style="background:linear-gradient(90deg,#e98e6d 0%,#f2c763 ${Math.max(0, zoneStart - 10)}%,#79b46a ${zoneStart}%,#79b46a ${Math.round(fireEnd * 100)}%,#e77f5c ${Math.round(fireEnd * 100)}%,#d85f49 100%)" role="img" aria-label="火候指針計量條，綠色區間為完美火候"><div class="ok" style="left:${zoneStart}%;width:${zoneWidth}%"></div><div class="cur" id="cur"></div></div>
    <div class="center"><button id="done" class="green hero-button cook-button" type="button">✨ 完成料理！</button></div>
    <p class="center muted"><small>當指針落在綠色區域即可獲得完美火候加分。</small></p>`, 'cooking');
}
function finishCooking(quality) {
  if (gameScreen !== 'cooking') return;
  clearTimers();
  order.quality = quality;
  order.cooking = false;
  play('ding');
  showServe();
}
function showServe() {
  const quality = { perfect: '✨ 完美火候！', raw: '🥶 還沒熟！', burnt: '🔥 有點燒焦！' }[order.quality];
  const dish = DISHES[order.chosen];
  render(`<div class="plating-screen"><span class="eyebrow">PLATING · 出餐時間</span><h2>料理完成，準備送餐！</h2><div class="plated-dish-card"><img src="${dish.art}" alt="${dish.name}插畫" draggable="false"><div><strong>${dish.emoji} ${dish.name}</strong><span class="quality-stamp ${order.quality}">${quality}</span><small>已選食材：${order.items.join('、')}</small></div></div><div class="order-checkline">${order.chosen === order.dishKey ? '✅' : '▫️'} 顧客訂單：${DISHES[order.dishKey].name}</div><p class="muted center">端上熱騰騰的餐點，看看 ${NPCS[order.npcKey].name} 會怎麼說！</p><div class="center"><button id="serve" class="green hero-button" type="button">🍽️ 送餐給 ${NPCS[order.npcKey].name}</button></div></div>`, 'serve');
  bind('serve', serve);
  saveGame();
}

function serve() {
  if (!order || gameScreen !== 'serve') return;
  const npc = NPCS[order.npcKey];
  const dish = DISHES[order.chosen];
  const correct = order.chosen === order.dishKey;
  const ingredientsCorrect = dish.items.length === order.items.length && dish.items.every((item) => order.items.includes(item));
  const success = ingredientsCorrect && order.quality === 'perfect';
  const elapsed = (Date.now() - order.start) / 1000;
  const fast = elapsed <= order.patience * 0.7;
  const reasons = [];
  let satisfaction = 0;
  const award = (label, points, met) => {
    reasons.push({ label, points: met ? points : 0, met });
    if (met) satisfaction += points;
  };
  award('正確料理', 40, correct);
  award('喜愛料理', 20, npc.love.includes(order.chosen));
  award('料理成功（正確食材＋完美火候）', 20, success);
  award(`快速完成（${elapsed.toFixed(1)} 秒）`, 10, fast);
  award('Combo（上一位達「滿意」以上）', 10, day.lastGood);
  satisfaction = Math.min(100, satisfaction);
  const rating = satisfaction >= 90 ? '非常滿意 😍' : satisfaction >= 75 ? '滿意 😊' : satisfaction >= 60 ? '普通 😐' : '不滿意 😞';
  const dialogue = satisfaction >= 90 ? pick(npc.great) : satisfaction >= 60 ? pick(npc.ok) : pick(npc.bad);
  const coins = Math.round(DISHES[order.dishKey].price * (satisfaction / 100) * signMult() * currentStrategy().coinMultiplier) + (satisfaction >= 90 ? 10 : 0);
  day.lastGood = satisfaction >= 75;
  day.combo = day.lastGood ? day.combo + 1 : 0;
  day.bestCombo = Math.max(day.bestCombo || 0, day.combo);
  if (fast) day.fastServed = (day.fastServed || 0) + 1;
  if (success) day.flawless = (day.flawless || 0) + 1;
  const reputationGained = Math.max(1, Math.floor(satisfaction / 10));
  day.reputationEarned = (day.reputationEarned || 0) + reputationGained;
  state.reputation += reputationGained;
  day.earned += coins;
  day.served++;
  day.satisfactionTotal = (day.satisfactionTotal || 0) + satisfaction;
  if (satisfaction > (day.topSatisfaction || 0)) {
    day.topSatisfaction = satisfaction;
    day.topCustomer = { name: npc.name, breed: npc.breed, img: npc.img, satisfaction };
  }
  if (satisfaction >= 90) day.great++;
  day.index++;
  state.coins += coins;
  state.served++;
  const log = state.npcLog[order.npcKey] || { visits: 1, orders: 1, walkouts: 0, best: 0, served: 0 };
  log.served = (log.served || 0) + 1;
  log.best = Math.max(log.best || 0, satisfaction);
  log.last = satisfaction;
  state.npcLog[order.npcKey] = log;
  order.result = { satisfaction, rating, dialogue, coins, elapsed, reasons, reputation: reputationGained };
  play('coin');
  try { window.ProgressLogger?.logProgress?.('serve', { satisfaction, coins }); } catch { /* 遊戲流程不依賴外部記錄器 */ }
  showResult();
}
function showResult() {
  const npc = NPCS[order.npcKey];
  const result = order.result;
  if (!result) return showServe();
  const moodClass = result.satisfaction >= 90 ? 'delighted' : result.satisfaction >= 75 ? 'happy' : result.satisfaction >= 60 ? 'okay' : 'sad';
  const reaction = result.satisfaction >= 90 ? '💖' : result.satisfaction >= 75 ? '🐾' : result.satisfaction >= 60 ? '☺️' : '💧';
  render(`<div class="result-scene ${moodClass}"><div class="result-heading"><span class="eyebrow">GUEST REVIEW · 熟客回饋</span><h2>${npc.name} 的用餐心情</h2></div>
    <div class="result-card"><div class="reaction-portrait-wrap"><div class="reaction-burst" aria-hidden="true">${reaction}</div><img class="portrait result-portrait" src="${npc.img}" alt="${npc.name}的${result.satisfaction >= 75 ? '開心' : result.satisfaction >= 60 ? '滿意' : '失望'}反應"></div><section class="result-details">
    <div class="rating-label">${result.rating}</div><div class="big satisfaction-score">${result.satisfaction}<small>%</small></div>
    <div class="bubble">💬 ${result.dialogue}</div>
    <div class="score-breakdown"><h3>本次滿意度來源</h3>${result.reasons.map((reason) => `<div class="score-row ${reason.met ? 'earned' : ''}"><span>${reason.met ? '✅' : '▫️'} ${reason.label}</span><strong>${reason.met ? '+' : ''}${reason.points}</strong></div>`).join('')}</div>
    <div class="reward-strip"><div>🪙 <span>獲得金幣</span><strong>+${result.coins}</strong></div><div>⭐ <span>累積口碑</span><strong>+${result.reputation || 0}</strong></div></div>
    <div class="center"><button id="next" class="green hero-button" type="button">${day.index >= CUSTOMERS_PER_DAY ? '前往本日結算　→' : '迎接下一位顧客　→'}</button></div></section></div></div>`, 'result');
  bind('next', nextCustomer);
  saveGame();
}

function showSummary() {
  clearTimers();
  if (!day.summaryPaid) {
    day.summaryBonus = day.goals.reduce((sum, goal) => sum + (goalMet(goal) ? goal.reward : 0), 0);
    state.coins += day.summaryBonus;
    day.promotions = [];
    const earnedRank = rankForReputation(state.reputation);
    while (state.rank < earnedRank) {
      state.rank++;
      const promotion = REPUTATION_RANKS[state.rank];
      state.coins += promotion.reward;
      day.promotions.push({ name: promotion.name, reward: promotion.reward });
    }
    day.summaryPaid = true;
  }
  const average = day.served ? Math.round((day.satisfactionTotal || 0) / day.served) : 0;
  const walkouts = Math.max(0, day.index - day.served);
  const currentRank = REPUTATION_RANKS[state.rank];
  const nextRank = REPUTATION_RANKS[state.rank + 1];
  const repProgress = nextRank
    ? Math.max(0, Math.min(100, ((state.reputation - currentRank.reputation) / (nextRank.reputation - currentRank.reputation)) * 100))
    : 100;
  const rankCard = `<div class="reputation-card"><div class="rep-heading"><span>⭐ 餐車口碑</span><strong>${currentRank.name}</strong><b>${state.reputation} ✦</b></div><div class="rep-track"><span style="width:${repProgress}%"></span></div><small>${nextRank ? `距離「${nextRank.name}」還差 ${Math.max(0, nextRank.reputation - state.reputation)} 口碑` : '最高頭銜已達成！汪界王牌！'}</small></div>`;
  const promotions = (day.promotions || []).map((promotion) => `<div class="promotion-note">🏅 晉升「${promotion.name}」！獲得 ${promotion.reward} 金幣獎金</div>`).join('');
  const starGuest = day.topCustomer
    ? `<div class="mvp-card"><img src="${day.topCustomer.img}" alt=""><div><small>今日王牌顧客</small><strong>${day.topCustomer.name}｜${day.topCustomer.breed}</strong><span>滿意度 ${day.topCustomer.satisfaction}% · 尾巴搖到停不下來！</span></div>🏆</div>`
    : '';
  render(`<div class="summary-heading"><span class="eyebrow">CLOSING TIME · 今日營業結束</span><h2>🌙 第 ${state.day} 天・營業結算</h2><p>辛苦了，老闆！今天的每一份餐點都值得記錄。</p></div>
    <div class="summary-stats"><div><small>服務顧客</small><strong>${day.served}<span>/${CUSTOMERS_PER_DAY}</span></strong></div><div><small>平均滿意度</small><strong>${average}<span>%</span></strong></div><div><small>非常滿意</small><strong>${day.great}<span> 次</span></strong></div><div><small>離開顧客</small><strong>${walkouts}<span> 位</span></strong></div><div><small>最高 Combo</small><strong>${day.bestCombo || 0}<span> 連擊</span></strong></div></div>
    ${rankCard}${promotions}${starGuest}<div class="receipt summary-receipt"><div>🍽️ 今日營業收入 <strong>${day.earned} 金幣</strong></div><div>⭐ 今日累積口碑 <strong>+${day.reputationEarned || 0} ✦</strong></div><div>🎁 每日目標獎勵 <strong>+${day.summaryBonus} 金幣</strong></div><div>💰 錢包餘額 <strong>${state.coins} 金幣</strong></div></div>
    <h3>今日營業目標與特別委託</h3>${day.goals.map((goal) => `<div class="goal">${goalMet(goal) ? '✅' : '▫️'} ${goal.text}${goalMet(goal) ? `（+${goal.reward} 金）` : '（未達成）'}</div>`).join('')}
    <div class="center"><button id="up" class="green">🔧 前往餐車升級</button></div>`, 'summary');
  bind('up', () => showUpgrades());
  saveGame();
}
function showUpgrades(newlyUpgraded = null) {
  const cost = (key) => 80 + state.upgrades[key] * 70;
  render(`<div class="summary-heading"><span class="eyebrow">GARAGE · 餐車整備</span><h2>🔧 為明天做好準備</h2><p>錢包餘額　🪙 ${state.coins} 金幣</p></div>
    <p class="muted center">投資餐車設備，讓每天的營業越來越順利。每項最高 Lv.5。</p>
    <div class="upgrade-list">${Object.entries(UPGRADE_INFO).map(([key, upgrade]) => `<div class="goal upgrade upgrade-card ${newlyUpgraded === key ? 'upgrade-success' : ''}" id="upgrade-${key}"><div class="upgrade-icon">${upgrade.icon}</div><span class="upgrade-copy"><strong>${upgrade.name}</strong><b>Lv.${state.upgrades[key]}／5</b><small>${upgrade.desc}</small><span class="upgrade-levels" aria-label="升級進度">${[1, 2, 3, 4, 5].map((level) => `<i class="${state.upgrades[key] >= level ? 'filled' : ''}"></i>`).join('')}</span></span>
      <button id="u-${key}" ${state.upgrades[key] >= 5 || state.coins < cost(key) ? 'disabled' : ''}>${state.upgrades[key] >= 5 ? '已滿級' : `升級 ${cost(key)} 金`}</button>${newlyUpgraded === key ? '<span class="upgrade-sparkles" aria-hidden="true">✦　✧　✦</span>' : ''}</div>`).join('')}</div>
    ${newlyUpgraded ? `<div class="upgrade-toast">✨ 設備升級成功！金幣已投入餐車</div>` : ''}
    <div class="center" style="margin-top:18px"><button id="nextday" class="hero-button">🌤️ 開始第 ${state.day + 1} 天　→</button></div>`, 'upgrades');
  if (newlyUpgraded) window.setTimeout(() => document.getElementById(`upgrade-${newlyUpgraded}`)?.classList.remove('upgrade-success'), 1100);
  Object.keys(UPGRADE_INFO).forEach((key) => bind(`u-${key}`, () => {
    if (state.coins < cost(key) || state.upgrades[key] >= 5) return;
    state.coins -= cost(key);
    state.upgrades[key]++;
    saveGame();
    play('coin');
    showUpgrades(key);
  }));
  bind('nextday', () => {
    state.day++;
    startDay(false);
  });
  saveGame();
}

function restoreSession() {
  clearTimers();
  const saved = state.session;
  const validQueue = Array.isArray(saved?.day?.queue) && saved.day.queue.length === CUSTOMERS_PER_DAY && saved.day.queue.every((key) => NPCS[key]);
  const validDay = saved?.day && Number.isInteger(saved.day.index) && saved.day.index >= 0 && saved.day.index <= CUSTOMERS_PER_DAY && Array.isArray(saved.day.goals);
  if (!validQueue || !validDay) {
    state.session = null;
    showTitle();
    return;
  }
  day = { ...saved.day, goals: saved.day.goals.map((goal) => ({ ...goal })) };
  day.strategy = STRATEGIES[day.strategy] ? day.strategy : 'precision';
  day.bestCombo = Number.isFinite(day.bestCombo) ? day.bestCombo : (day.combo || 0);
  day.fastServed = Number.isFinite(day.fastServed) ? day.fastServed : 0;
  day.flawless = Number.isFinite(day.flawless) ? day.flawless : 0;
  day.reputationEarned = Number.isFinite(day.reputationEarned) ? day.reputationEarned : 0;
  day.promotions = Array.isArray(day.promotions) ? day.promotions : [];
  if (!day.summaryPaid && !day.goals.some((goal) => DAILY_CONTRACTS.some((contract) => contract.type === goal.type))) {
    day.goals.push({ ...pick(DAILY_CONTRACTS) });
  }
  if (!day.summaryPaid) {
    const revenueGoal = day.goals.find((goal) => goal.type === 'earned');
    if (revenueGoal) {
      revenueGoal.target = dailyRevenueTarget();
      revenueGoal.text = `今日營收達到 ${revenueGoal.target} 金幣`;
    }
  }
  order = saved.order ? { ...saved.order, items: [...(saved.order.items || [])] } : null;
  const pausedFor = Number.isFinite(saved.pausedAt) ? Math.max(0, Date.now() - saved.pausedAt) : 0;
  if (order && pausedFor > 0) {
    if (Number.isFinite(order.start)) order.start += pausedFor;
    if (order.cooking && Number.isFinite(order.cookingStartedAt)) order.cookingStartedAt += pausedFor;
  }
  const orderScreens = ['customer', 'kitchen', 'ingredients', 'cooking', 'serve', 'result', 'walkout'];
  if (orderScreens.includes(saved.screen) && (!order || !NPCS[order.npcKey] || !DISHES[order.dishKey])) {
    order = null;
    nextCustomer();
    return;
  }
  switch (saved.screen) {
    case 'goals': showGoals(); break;
    case 'customer': showCustomer(); break;
    case 'kitchen': showKitchen(); break;
    case 'ingredients': showIngredients(); break;
    case 'cooking': startCooking(true); break;
    case 'serve': showServe(); break;
    case 'result': showResult(); break;
    case 'walkout': {
      const npc = NPCS[order?.npcKey];
      if (npc) {
        render(`<div class="row"><img class="portrait" src="${npc.img}" alt="${npc.name}"><section><h2>😢 ${npc.name} 等得不耐煩，先離開了</h2><div class="bubble">💬 ${order.leaveLine || pick(npc.leave)}</div><button id="next" class="green">下一位顧客</button></section></div>`, 'walkout');
        bind('next', nextCustomer);
      } else nextCustomer();
      break;
    }
    case 'summary': showSummary(); break;
    case 'upgrades': showUpgrades(); break;
    default: showTitle();
  }
}

showTitle();

let hiddenAt = null;
document.addEventListener('visibilitychange', () => {
  if (document.querySelector('.dialog-overlay')) {
    if (document.hidden && day) saveGame(Date.now());
    return;
  }
  if (document.hidden && day && gameScreen !== 'title') {
    hiddenAt = Date.now(); clearTimers(); saveGame(hiddenAt);
  } else if (!document.hidden && hiddenAt !== null) {
    const paused = Date.now() - hiddenAt; hiddenAt = null;
    if (order) {
      if (Number.isFinite(order.start)) order.start += paused;
      if (order.cooking && Number.isFinite(order.cookingStartedAt)) order.cookingStartedAt += paused;
    }
    if (!document.querySelector('.dialog-overlay')) {
      if (gameScreen === 'cooking') startCooking(true);
      else if (['customer','kitchen','ingredients'].includes(gameScreen)) startPatience();
      saveGame();
    }
  }
});
window.addEventListener('pagehide',()=>{if(day && gameScreen !== 'title') saveGame(Date.now());});
document.addEventListener('keydown',e=>{
  const dialog=document.querySelector('.confirm-dialog');
  if(!dialog || e.key !== 'Tab')return;
  const buttons=[...dialog.querySelectorAll('button:not(:disabled)')];
  if(e.shiftKey && document.activeElement === buttons[0]){e.preventDefault();buttons.at(-1).focus();}
  if(!e.shiftKey && document.activeElement === buttons.at(-1)){e.preventDefault();buttons[0].focus();}
});

</script>
  </body>
</html>
